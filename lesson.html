<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get("eink");
          var on;
          if (q === "1" || q === "true") {
            on = true;
            localStorage.setItem("mandarin-eink-mode", "1");
          } else if (q === "0" || q === "false") {
            on = false;
            localStorage.setItem("mandarin-eink-mode", "0");
          } else {
            on = localStorage.getItem("mandarin-eink-mode") === "1";
          }
          if (on) document.documentElement.classList.add("eink-mode");
        } catch (e) { /* private mode */ }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mei · Mandarin Tutor</title>
    <meta name="theme-color" content="#1b325e">
    <meta property="og:title" content="Mei · Mandarin Tutor">
    <meta property="og:description" content="Weekday Mandarin lessons from Mei.">
    <meta property="og:image" content="https://atlas-grok.github.io/mandarin-lessons/assets/og-image.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css?v=8">
    <link rel="stylesheet" href="assets/eink.css?v=1">
  </head>
